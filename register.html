{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Create Account</h2>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <label>Name</label>

        <input type="text"
               name="name"
               required>


        <label>Email</label>

        <input type="email"
               name="email"
               required>


        <label>Password</label>

        <input type="password"
               name="password"
               minlength="6"
               required>


        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>

{% endblock %}
